<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة خاصة ❤️</title>
    <style>
        body { font-family: sans-serif; background-color: #ffe6eb; text-align: center; padding: 20px; color: #d63384; }
        .box { background: white; padding: 20px; border-radius: 15px; max-width: 350px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input { padding: 10px; width: 80%; margin: 10px 0; border: 1px solid #ffb6c1; border-radius: 8px; text-align: center; font-size: 16px; }
        button { padding: 10px 20px; background-color: #ff4d6d; color: white; border: none; border-radius: 8px; font-size: 16px; }
        .content { display: none; }
    </style>
</head>
<body>

    <!-- صندوق كلمة السر -->
    <div id="login" class="box">
        <h2>🔒 الصفحة دي بحساب خاص</h2>
        <p>اكتبي الباسورد عشان تفتحي المفاجأة:</p>
        <input type="password" id="pass" placeholder="كلمة السر">
        <br>
        <button onclick="openPage()">دخول ❤️</button>
        <p id="error" style="color:red; display:none; margin-top:10px;">الباسورد غلط!</p>
    </div>

    <!-- المحتوى بعد كلمة السر -->
    <div id="secret" class="box content">
        <h1>بحبك جداً ❤️</h1>
        <p>كل لحظة معاك هي أحلى لحظة في حياتي!</p>
    </div>

    <script>
        function openPage() {
            var p = document.getElementById("pass").value;
            // الباسورد الحالي هو 1234
            if (p === "1234") {
                document.getElementById("login").style.display = "none";
                document.getElementById("secret").style.display = "block";
            } else {
                document.getElementById("error").style.display = "block";
            }
        }
    </script>

</body>
</html>
